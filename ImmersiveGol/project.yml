name: ImmersiveGol

packages:
  UntoldEngine:
    url: https://github.com/untoldengine/UntoldEngine.git
    branch: develop
  UntoldJoltPhysics:
    url: https://github.com/untoldengine/UntoldJoltPhysics.git
    branch: develop

targets:
  ImmersiveGol:
    type: application
    platform: visionOS
    deploymentTarget: 26.0
    sources:
      - path: Sources
        excludes:
          - "ImmersiveGol/GameData"
      - path: Sources/ImmersiveGol/GameData
        type: folder
        buildPhase: resources
    dependencies:
      - package: UntoldJoltPhysics
        product: UntoldJoltPhysics
      - package: UntoldEngine
        product: UntoldEngineXR
      - package: UntoldEngine
        product: UntoldEngineAR
      - package: UntoldEngine
        product: UntoldComponentKit
    settings:
      base:
                PRODUCT_BUNDLE_IDENTIFIER: com.untoldengine.mygame
                SWIFT_VERSION: 5.0
                MARKETING_VERSION: "1.0"
                CURRENT_PROJECT_VERSION: "1"
                INFOPLIST_FILE: Sources/ImmersiveGol/Info.plist
                UNTOLD_ENGINE_PACKAGE_ROOT: "$(BUILD_DIR)/../../SourcePackages/checkouts/UntoldEngine"
                MTL_HEADER_SEARCH_PATHS: "$(inherited) $(UNTOLD_ENGINE_PACKAGE_ROOT)/Sources/UntoldEngineShaderSupport/include"
                CODE_SIGN_STYLE: Automatic
                DEVELOPMENT_TEAM: PXXZLXYJ26
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
                  SWIFT_COMPILATION_MODE: wholemodule
                  SWIFT_OPTIMIZATION_LEVEL: -O
                  DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
